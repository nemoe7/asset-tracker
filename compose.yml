services:
  astra:
    image: ghcr.io/nemoe7/asset-tracker:latest
    container_name: ${ASTRA_ID}
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://localhost:5000/health")
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./app_data:/home/appuser/.data
    networks:
      - astra

  tailscale:
    image: tailscale/tailscale:stable
    container_name: ${ASTRA_ID}-tailscale
    hostname: ${ASTRA_ID}
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ./astra-tailscale:/var/lib/tailscale
    restart: unless-stopped
    networks:
      - astra

networks:
  astra:
