services:
  app:
    image: ghcr.io/nemoe7/inventory-management:latest
    container_name: ${ZROK2_SHARE_NAME}
    restart: unless-stopped
    depends_on:
      zrok:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./data:/home/appuser/data

  zrok:
    image: docker.io/openziti/zrok2
    container_name: ${ZROK2_SHARE_NAME}-zrok
    restart: unless-stopped
    stop_grace_period: 30s
    user: root
    environment:
      HOME: /mnt
      ZROK2_ENABLE_TOKEN: ${ZROK2_ENABLE_TOKEN}
      ZROK2_SHARE_NAME: ${ZROK2_SHARE_NAME}
      DL_USE_JSON: false
    ports:
      - "8888:8888"
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /mnt/.zrok2/environment.json ]; then
          zrok2-enable
          zrok2 create name "$${ZROK2_SHARE_NAME}"
        fi

        chown -R 2171:2171 /mnt
        rm -f /mnt/.zrok2/agent.socket

        shares="$$(zrok2 list shares --json 2>/dev/null || true)"

        if [ -n "$$shares" ] && [ "$$shares" != "{}" ]; then
          echo "$$shares" |
            jq -r '.shares[].shareToken' |
            while read -r token; do
              [ -z "$$token" ] || zrok2 delete share "$$token" || true
            done
        fi

        zrok2 agent start \
          --console-address 0.0.0.0 \
          --console-start-port 8888 \
          --console-end-port 8888 &
        agent_pid=$$!

        sleep 2

        if ! zrok2 list shares --json 2>/dev/null |
          jq -e '.shares | length > 0' >/dev/null 2>&1; then
          zrok2 share public http://app:5000 \
            --subordinate \
            -b proxy \
            --name-selection "public:$${ZROK2_SHARE_NAME}" &
        fi

        wait "$$agent_pid"

    volumes:
      - zrok_env:/mnt

volumes:
  zrok_env:
