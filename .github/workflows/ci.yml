name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yml"
      - "compose.dev.yml"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yml"
      - "compose.dev.yml"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest -n auto
        env:
          SECRET_KEY: test-secret-key
