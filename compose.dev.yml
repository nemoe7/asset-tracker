services:
  astra:
    build:
      context: .
    container_name: ${ZROK2_SHARE_NAME}-dev
    restart: unless-stopped
    depends_on:
      zrok:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://localhost:5000/health")
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - .:/home/appuser
    working_dir: /home/appuser
    command: python run.py

  tailscale:
    image: tailscale/tailscale:stable
    container_name: ${ASTRA_ID}-tailscale
    hostname: ${ASTRA_ID}
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ./astra-tailscale:/var/lib/tailscale
    restart: unless-stopped
    networks:
      - astra

volumes:
  zrok_env:
